name: Daily Update Baugesuche

on:
  schedule:
    # Every day at 06:00 UTC (08:00 CEST/07:00 CET)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and update data
        run: npm run update
        timeout-minutes: 50

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -z "$(git status --porcelain -- data/baugesuche*.json)" ]; then
            echo "No changes detected in data"
          else
            git add data/baugesuche*.json
            git commit -m "chore: update baugesuche data [skip ci]"
            git push
          fi
